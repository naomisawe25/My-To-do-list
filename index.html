<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple to-do list to organize and keep track of your tasks."
    />
    <title>To-Do List App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <p class="eyebrow">YOUR DAY, IN FOCUS</p>
        <h1>My To-do list</h1>
        <p class="subtitle">A little progress adds up. What needs doing?</p>
      </header>

      <section class="task-panel" aria-label="Task manager">
        <form id="task-form" class="task-form">
          <label for="task-input">Add a task</label>
          <div class="input-row">
            <input
              id="task-input"
              name="task"
              type="text"
              placeholder="e.g. Plan the week"
              autocomplete="off"
              maxlength="200"
              aria-describedby="message"
            />
            <button class="add-button" type="submit">Add Task</button>
          </div>
          <p id="message" class="message" role="status" aria-live="polite"></p>
        </form>

        <div class="list-header">
          <h2>Your tasks</h2>
          <div class="list-actions">
            <span id="task-count" class="task-count">Total tasks: 0</span>
            <button id="clear-button" class="clear-button" type="button">
              Clear all tasks
            </button>
          </div>
        </div>

        <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
        <p id="empty-state" class="empty-state">Nothing on your list yet. Add a task to get started.</p>
      </section>

      <footer>One task at a time.</footer>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
